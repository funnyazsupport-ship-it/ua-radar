# Розгортання сервера UA-RADAR.
#
# Головне тут — машина НЕ засинає: сервер має опитувати канали
# безперервно, інакше весь сенс втрачається. Тому auto_stop вимкнено,
# а min_machines_running = 1.
app = "ua-radar"
primary_region = "waw"   # Варшава — найближче до України

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
