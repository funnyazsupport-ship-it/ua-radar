# Розгортання на Render — хостинг, який не вимагає картки.
#
# ВАЖЛИВО ПРО БЕЗКОШТОВНИЙ ТАРИФ. Render присипляє сервіс після
# ~15 хвилин без вхідних запитів. Для монітора це означає, що без
# відвідувачів він перестає читати канали.
#
# Нас це влаштовує, бо затримка зникає саме тоді, коли вона важлива:
#   - хтось відкрив мапу → сторінка опитує сервер кожні 6 секунд →
#     сервіс не засинає й веде обстановку в реальному часі;
#   - ніхто не дивиться → сервіс спить, а дані бере статичний знімок
#     від GitHub Actions (раз на 5 хвилин).
#
# Перше пробудження триває близько пів хвилини — сторінка в цей час
# показує знімок, тож порожньої мапи не буде.
services:
  - type: web
    name: ua-radar
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      # ключ ШІ задається в інтерфейсі Render, не в репозиторії
      - key: AI_PROVIDER
        value: deepseek
      - key: AI_KEY
        sync: false
